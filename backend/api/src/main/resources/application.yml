spring:
  application:
    name: repository-intelligence-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/repo_intelligence}
    username: ${DATABASE_USERNAME:repo_intelligence}
    password: ${DATABASE_PASSWORD:repo_intelligence}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID:github-client-id-not-configured}
            client-secret: ${GITHUB_CLIENT_SECRET:github-client-secret-not-configured}
            scope: read:user,user:email,repo
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: ${API_PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: ${SESSION_COOKIE_SAME_SITE:lax}
        secure: ${SESSION_COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: Repository Intelligence API
    description: Coordinates repositories and engineering health analysis jobs.

app:
  cors:
    allowed-origins: ${FRONTEND_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  analysis:
    queue-name: ${ANALYSIS_QUEUE_NAME:analysis:pending}
  github:
    client-id: ${GITHUB_CLIENT_ID:}
    client-secret: ${GITHUB_CLIENT_SECRET:}
    token-encryption-key: ${GITHUB_TOKEN_ENCRYPTION_KEY:}
    frontend-redirect-url: ${GITHUB_FRONTEND_REDIRECT_URL:http://localhost:5173}