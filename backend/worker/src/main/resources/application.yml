spring:
  application:
    name: repository-intelligence-worker
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

server:
  port: ${WORKER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  analysis:
    queue-name: ${ANALYSIS_QUEUE_NAME:analysis:pending}
    poll-delay-ms: ${ANALYSIS_POLL_DELAY_MS:2000}